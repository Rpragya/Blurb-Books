<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121118" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply a stored theme before first paint so there's no flash of the wrong one.
      try {
        var t = localStorage.getItem('blurb-books:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <meta name="description" content="Blurb Books — discover, preview and locate books in your library." />
    <link rel="icon" href="/images/blurb-logo.jpg" />
    <title>Blurb Books — Your next chapter awaits</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
